name: Altru
description: Altru (Altru Labs, Inc.) was a mobile-first, employee-generated video storytelling
  platform for recruitment marketing and talent acquisition, enabling organizations to capture,
  edit, brand, approve, and distribute authentic employee video content across career sites, social
  media, and email/text campaigns, with video transcription in 14+ languages. Founded in 2017 and
  based in Brooklyn, New York, and backed by Techstars, Altru served brands including Target, PwC,
  Intuit, L'Oreal, and Box before being acquired by iCIMS on December 14, 2020 and folded into the
  iCIMS Talent Cloud. Altru no longer operates as an independent provider — altrulabs.com now
  redirects to icims.com and there is no public developer or API surface.
